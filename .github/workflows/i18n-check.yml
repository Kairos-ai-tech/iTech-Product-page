name: i18n Key Parity Check

on:
  pull_request:
    paths:
      - 'i18n.js'
      - 'index.html'
      - 'styles.css'
      - 'scripts/check-i18n-keys.js'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-i18n-keys.js
