name: i18n Key Parity Check

on:
  push:
    paths:
      - 'i18n.js'
      - 'index.html'
      - 'scripts/check-i18n-keys.js'
  pull_request:
    paths:
      - 'i18n.js'
      - 'index.html'
      - 'scripts/check-i18n-keys.js'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-i18n-keys.js
